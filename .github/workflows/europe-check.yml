name: Europe reachability check

on:
  workflow_dispatch:
    inputs:
      speed_target_samples:
        description: "Download catch-up target (0 keeps normal oldest-first rotation)"
        type: choice
        options: ["0", "6"]
        default: "0"
  workflow_run:
    workflows: ["Update proxy list"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: europe-check
  cancel-in-progress: false

jobs:
  check:
    name: Availability, rotating speed and long-connection checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: content

      - name: Mark job start
        run: touch .jobstart

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Skip failed trigger
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] \
             && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Triggering update failed; keeping previous lists"
          fi

      - name: Test Europe list builder
        if: steps.gate.outputs.skip != 'true'
        run: python -m unittest tests.test_europe_check

      - name: Probe and filter on GitHub runner
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python scripts/europe_check.py
          --source data/valid/all.txt
          --workers 400 --timeout 3
          --speed-budget 5400 --speed-workers 20
          --long-budget 200 --long-workers 50
          --long-duration 60 --long-interval-seconds 1
          --speed-target-samples ${{ inputs.speed_target_samples || '0' }}
          --run-timeout 1500
          --min-speed-mbps 2

      - name: Commit Europe results
        if: steps.gate.outputs.skip != 'true'
        run: |
          bash .github/scripts/commit_data.sh "chore(data): GitHub runner candidates ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
