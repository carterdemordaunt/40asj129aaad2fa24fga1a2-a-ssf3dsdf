name: Europe one-day sampling catch-up

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: europe-catchup-2026-10-15
  cancel-in-progress: false

jobs:
  coordinate:
    name: Coordinate bounded slice ${{ matrix.slice }}
    if: github.repository == 'carterdemordaunt/40asj129aaad2fa24fga1a2-a-ssf3dsdf'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        slice: [1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout content scripts and measurements
        uses: actions/checkout@v7
        with:
          ref: content

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test the bounded coordinator
        run: python -m unittest tests.test_europe_catchup -q

      - name: Continue due sampling or finalize today's report
        id: plan
        run: python -u scripts/europe_catchup.py --execute --watch

      - name: Disable this temporary workflow on completion, expiry or failure
        if: always() && (failure() || steps.plan.outputs.stop == 'true')
        run: >-
          gh workflow disable europe-catchup.yml
          --repo carterdemordaunt/40asj129aaad2fa24fga1a2-a-ssf3dsdf
